# Optimized AeroSpace Config for Dual Monitors
# Lives at ~/.config/aerospace/aerospace.toml
# Monitors are stacked vertically: LG HDR WFHD on top, ASUS VG32VQ1B below.

after-login-command = []
after-startup-command = []

start-at-login = true

# Normalizations
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Layout settings
accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

key-mapping.preset = 'qwerty'

# Mouse follows focus when changing monitors
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Gaps
[gaps]
inner.horizontal = 10
inner.vertical =   10
outer.left =       10
outer.bottom =     10
outer.top =        10
outer.right =      10

# Workspace to Monitor Assignment
# Main monitor (ASUS VG32VQ1B): workspaces 1-5
# Secondary monitor (LG HDR WFHD): workspaces 6-9
[workspace-to-monitor-force-assignment]
1 = 'LG HDR WFHD'
2 = 'LG HDR WFHD'
3 = 'LG HDR WFHD'
4 = 'LG HDR WFHD'
5 = 'LG HDR WFHD'
6 = 'ASUS VG32VQ1B'
7 = 'ASUS VG32VQ1B'
8 = 'ASUS VG32VQ1B'
9 = 'ASUS VG32VQ1B'


# Main Mode Keybindings
[mode.main.binding]

# Layout switching
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

# Focus navigation
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Move windows
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Workspace switching
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'

# Move windows to workspaces
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'

# App launchers
# Music checks the Option key at launch; if it is still held it shows the
# "Choose Music Library" prompt. Delay the cold launch until alt is released.
alt-m = 'exec-and-forget pgrep -x Music >/dev/null || sleep 0.4; open -a Music'
alt-s = 'exec-and-forget open -a "Zen"'
alt-o = '''exec-and-forget osascript -e 'tell application "Obsidian" to activate' '''
alt-g = '''exec-and-forget osascript -e 'tell application "Ghostty" to activate' '''
alt-c = '''exec-and-forget osascript -e 'tell application "Visual Studio Code" to activate' '''
alt-w = '''exec-and-forget osascript -e 'tell application "WhatsApp" to activate' '''
alt-shift-c = '''exec-and-forget osascript -e 'tell application "Claude" to activate' '''
alt-shift-d = "exec-and-forget open ~/Desktop"
alt-d = "exec-and-forget open ~/Downloads"
alt-u = "exec-and-forget open '/Users/rehaan/Library/Mobile Documents/com~apple~CloudDocs/University/'"
alt-i = "exec-and-forget open '/Users/rehaan/Library/Mobile Documents/com~apple~CloudDocs/'"
alt-a = '''exec-and-forget osascript -e 'tell application "Adobe Acrobat" to activate' '''

# Window management
alt-equal = 'balance-sizes'
alt-0 = 'flatten-workspace-tree'
alt-f = 'fullscreen'

# Monitor management
alt-tab = 'workspace-back-and-forth'
# Moves the WINDOW, not the workspace. Moving a workspace would be undone by
# workspace-to-monitor-force-assignment on the next sleep/wake or unplug.
alt-shift-tab = 'move-node-to-monitor --focus-follows-window --wrap-around next'

# Focus monitor directly (stacked monitors: k = up = LG, j = down = ASUS)
ctrl-alt-k = 'focus-monitor up'
ctrl-alt-j = 'focus-monitor down'

# Move window to monitor (stacked monitors: k = up = LG, j = down = ASUS)
ctrl-alt-shift-k = 'move-node-to-monitor --focus-follows-window up'
ctrl-alt-shift-j = 'move-node-to-monitor --focus-follows-window down'

# Reload config
ctrl-alt-shift-c = 'reload-config'

# Enter modes
alt-shift-semicolon = 'mode service'
alt-r = 'mode resize'

# Resize Mode
[mode.resize.binding]
h = 'resize width -50'
j = 'resize height +50'
k = 'resize height -50'
l = 'resize width +50'
shift-h = 'resize width -200'
shift-j = 'resize height +200'
shift-k = 'resize height -200'
shift-l = 'resize width +200'
enter = 'mode main'
esc = 'mode main'

# Service Mode
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
f = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']
alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']

# App Window Rules

## Browsers → Workspace 1 (Main Monitor)
[[on-window-detected]]
if.app-id = 'app.zen-browser.zen'
run = 'move-node-to-workspace 1'

## Terminal + VS Code → Workspace 2 (Main Monitor)
[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if.app-id = 'com.microsoft.VSCode'
run = 'move-node-to-workspace 2'

## Note apps → Workspace 3 (Main Monitor)
[[on-window-detected]]
if.app-id = 'md.obsidian'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-id = 'com.apple.Notes'
run = 'move-node-to-workspace 3'

## Chat apps
[[on-window-detected]]  # Messages → Workspace 4 (ASUS)
if.app-id = 'com.apple.MobileSMS'
run = 'move-node-to-workspace 4'

[[on-window-detected]]  # WhatsApp → Workspace 3 (ASUS), alongside notes
if.app-id = 'net.whatsapp.WhatsApp'
run = 'move-node-to-workspace 3'

## Music apps
[[on-window-detected]]  # Apple Music → Workspace 7 (LG)
if.app-id = 'com.apple.Music'
run = 'move-node-to-workspace 7'

[[on-window-detected]]  # Spotify → Workspace 5 (ASUS)
if.app-id = 'com.spotify.client'
run = 'move-node-to-workspace 5'

## Floating apps
[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.ActivityMonitor'
run = 'layout floating'
