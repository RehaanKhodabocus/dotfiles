# ~/.config/starship.toml

format = """
$os$directory$git_branch$git_status$nodejs$python$golang$rust
$character"""

palette = "oxocarbon"

[palettes.oxocarbon]
teal = "#3ddbd9"
pink = "#ee79d1"
green = "#42be65"
yellow = "#ffe97b"
red = "#ff7eb6"
grey = "#525252"
fg = "#dde1e6"
bg = "#161616"

# --- Prompt Character ---
[character]
success_symbol = "[❯](green bold)"
error_symbol = "[❯](red bold)"
vimcmd_symbol = "[❮](teal bold)"

# --- OS Icon ---
[os]
disabled = false
style = "grey"

[os.symbols]
Macos = " "
Linux = " "
Windows = " "

# --- Directory ---
[directory]
style = "teal bold"
truncation_length = 3
truncate_to_repo = true
home_symbol = "~"
read_only = " 󰌾"
read_only_style = "red"
format = "[$path]($style)[$read_only]($read_only_style) "

# --- Git ---
[git_branch]
symbol = " "
style = "pink bold"
format = "[$symbol$branch]($style) "
truncation_length = 20

[git_status]
style = "yellow"
format = '([\[$all_status$ahead_behind\]]($style) )'
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?"
stashed = "$"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

[git_commit]
commit_hash_length = 7
style = "grey"
tag_symbol = " 󰓼 "

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "yellow"

# --- Languages (only show when relevant) ---
[nodejs]
symbol = " "
style = "green"
format = "[$symbol($version)]($style) "
detect_files = ["package.json", ".nvmrc"]

[python]
symbol = " "
style = "yellow"
format = "[$symbol($version)]($style) "
detect_files = ["requirements.txt", "pyproject.toml", ".python-version"]

[golang]
symbol = " "
style = "teal"
format = "[$symbol($version)]($style) "

[rust]
symbol = " "
style = "red"
format = "[$symbol($version)]($style) "

# --- System ---
[memory_usage]
disabled = true
threshold = 75
symbol = "󰍛 "
style = "red"
format = "[$symbol${ram}]($style) "

[battery]
disabled = true
format = "[$symbol$percentage]($style) "

[[battery.display]]
threshold = 20
style = "red"

[[battery.display]]
threshold = 50
style = "yellow"

[time]
disabled = true
format = "[$time]($style) "
style = "grey"
time_format = "%H:%M"

[cmd_duration]
min_time = 2_000
style = "yellow"
format = "[󱎫 $duration]($style) "
show_milliseconds = false
