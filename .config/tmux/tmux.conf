# -- general -------------------------------------------------------------------

# TERM should be screen-* or tmux-*
set -g default-terminal "tmux-256color"

# enable 24-bit color (keys off the OUTER terminal's TERM, which is xterm-ghostty)
set -sa terminal-features ',xterm-ghostty:RGB'

set -sg repeat-time 600
setw -g mode-keys vi

# change the default prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# -- display -------------------------------------------------------------------

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g automatic-rename on
set -g set-titles on
set -g set-titles-string '#W/#T'
set -g monitor-activity on
set -g visual-activity off

# -- Keybindings ---------------------------------------------------------------

# Reload config
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"

# use v and h for window splitting
unbind %
unbind v
unbind '"'
unbind h
bind v split-window -h -c '#{pane_current_path}'
bind h split-window -v -c '#{pane_current_path}'

# Disable suspend-client. Ghostty launches tmux via `$SHELL -l -c`, which is
# non-interactive and has no job control -- a suspended client can never be
# resumed with `fg`, so C-z (an easy misfire for the `z` zoom bind) wedges the
# window permanently and forces a Ghostty quit.
unbind C-z

set -g mouse on

# -- copy mode -----------------------------------------------------------------

bind -Tcopy-mode-vi 'v' send-keys -X begin-selection
bind -Tcopy-mode-vi 'y' send-keys -X copy-selection-and-cancel

# -- theme (Refined Oxocarbon) -------------------------------------------------

set -g status-interval 5
set -g status-position bottom

# Transparent background so the terminal's background blur shows through
set -g status-style "bg=default,fg=#dde1e6"

# --- Left Side: [Session] / [Folder] ---
set -g status-left-length 50
set -g status-left "#[fg=#3ddbd9,bold,bg=default] 󰭦 #S #[fg=#525252] / #[fg=#dde1e6,nobold]󱞞 #{b:pane_current_path} #[fg=#525252] / "

# --- Right Side: [Host] / [Time] ---
set -g status-right-length 60
set -g status-right "#[fg=#525252] / #[fg=#3ddbd9]󰒋 #h #[fg=#525252] / #[fg=#dde1e6]󱑎 %Y-%m-%d %H:%M "

# --- Windows List ---
# Current window: Magenta Icon + Cyan Text (Matches your ripgrep palette)
setw -g window-status-current-style "fg=#3ddbd9,bold,bg=default"
setw -g window-status-current-format "#[fg=#ee79d1] 󰖯 #[fg=#3ddbd9]#I:#W#F "

# Inactive windows: Clean grey text, no background block
setw -g window-status-style "fg=#525252,nobold,bg=default"
setw -g window-status-format " 󰖰 #I:#W  "

# --- UI Elements ---
set -g pane-border-style "fg=#525252"
set -g pane-active-border-style "fg=#42be65"
set -g message-style "bg=#ee79d1,fg=#161616,bold"

# -- plugins -------------------------------------------------------------------

set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tpm'

# Initialization of TPM (Keep this at the very bottom)
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.local/share/tmux/plugins/'
# Literal path, not $XDG_DATA_HOME: the tmux server inherits env from whatever
# started it, not from your interactive shell, so the var is often empty here.
if "test ! -d ~/.local/share/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.local/share/tmux/plugins/tpm && ~/.local/share/tmux/plugins/tpm/bin/install_plugins'"

run "~/.local/share/tmux/plugins/tpm/tpm"
